  <g transform="translate(88,58) rotate(-6) scale(3.2)" stroke="#7F8A70" stroke-opacity="0.34" stroke-width="1.44" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></g>
