<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="persona-dash — personal growth dashboard on a Mingdao HAP backend">
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FAF5EC"/>
      <stop offset="0.55" stop-color="#F5EEDF"/>
      <stop offset="1" stop-color="#EFE4CD"/>
    </linearGradient>
    <linearGradient id="sheen45" x1="0" y1="420" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lamp" cx="600" cy="185" r="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDF4" stop-opacity="0.65"/>
      <stop offset="0.6" stop-color="#FFFDF4" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFFDF4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="600" cy="210" r="660" gradientUnits="userSpaceOnUse">
      <stop offset="0.6" stop-color="#7A6A50" stop-opacity="0"/>
      <stop offset="1" stop-color="#7A6A50" stop-opacity="0.16"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="132" x2="0" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#292217"/>
      <stop offset="1" stop-color="#57472E"/>
    </linearGradient>
    <linearGradient id="rule" x1="470" y1="0" x2="730" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5E8F5A"/>
      <stop offset="0.5" stop-color="#6E918F"/>
      <stop offset="1" stop-color="#8089BC"/>
    </linearGradient>
    <filter id="grainF" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.30  0 0 0 0 0.20  0 0 0 0.045 0"/>
    </filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="5.5" dy="6.5" stdDeviation="5" flood-color="#6B5B45" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- honed ivory marble slab -->
  <rect width="1200" height="420" rx="28" fill="url(#stone)"/>


  <rect width="1200" height="420" rx="28" fill="url(#lamp)"/>
  <rect width="1200" height="420" rx="28" fill="url(#sheen45)"/>

