  </g>

  <!-- title block: white line frame on the mat -->
  <g>
    <rect x="484" y="254" width="232" height="34" rx="4" fill="#1F4536" fill-opacity="0.55" stroke="#EAF1EA" stroke-opacity="0.85"/>
    <rect x="488.5" y="258.5" width="223" height="25" rx="2" fill="none" stroke="#EAF1EA" stroke-opacity="0.45"/>
    <text x="600" y="277" text-anchor="middle" fill="#F2F7EF"
          font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" letter-spacing="5">BY JQU224</text>
  </g>

  <text x="600" y="328" text-anchor="middle"
        font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace"
        font-size="16" letter-spacing="4" fill="#DCE6DD" fill-opacity="0.9">MINGDAO HAP &#183; GLM-4-FLASH &#183; AI IN THE LOOP</text>

  <!-- mat grain -->
  <rect width="1200" height="420" rx="28" filter="url(#grainF)" opacity="0.6"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="27.5" stroke="#12291F" stroke-opacity="0.45"/>
</svg>
