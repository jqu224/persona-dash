  <g transform="translate(150,344) rotate(-5) scale(2.6)" stroke="#9A917C" stroke-opacity="0.28" stroke-width="1.77" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></g>
  <g transform="translate(448,356) rotate(0) scale(2.1)" stroke="#8A87A0" stroke-opacity="0.22" stroke-width="2.19" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></g>
  <g transform="translate(682,360) rotate(0) scale(2.1)" stroke="#7F8A70" stroke-opacity="0.24" stroke-width="2.19" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></g>

  <rect width="1200" height="420" rx="28" fill="url(#vig)"/>

